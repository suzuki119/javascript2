<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人気投票</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>人気投票</h1>
    <div id="voteList">
        <div class="card" data-id="1">
            <div class="candidate-image">
                <img src="./images/fantasy_genbu.png" alt="玄武">
            </div>
            <div class="candidate-name">玄武</div>
            <div class="votes">0票</div>
            <div class="progress-bar">
                <div class="bar"></div>
            </div>
            <button class="vote-btn">投票する</button>
        </div>
        <div class="card" data-id="2">
            <div class="candidate-image">
                <img src="./images/youkai_suzaku.png" alt="朱雀">
            </div>
            <div class="candidate-name">朱雀</div>
            <div class="votes">0票</div>
            <div class="progress-bar">
                <div class="bar"></div>
            </div>
            <button class="vote-btn">投票する</button>
        </div>
        <div class="card" data-id="3">
            <div class="candidate-image">
                <img src="./images/youkai_byakko.png" alt="白虎">
            </div>
            <div class="candidate-name">白虎</div>
            <div class="votes">0票</div>
            <div class="progress-bar">
                <div class="bar"></div>
            </div>
            <button class="vote-btn">投票する</button>

        </div>
        <div class="card" data-id="4">
            <div class="candidate-image">
                <img src="./images/fantasy_seiryu.png" alt="青龍">
            </div>
            <div class="candidate-name">青龍</div>
            <div class="votes">0票</div>
            <div class="progress-bar">
                <div class="bar"></div>
            </div>
                <button class="vote-btn">投票する</button>
        </div>
    </div>

    <div class="gamble"></div>

    <script type="module" src="./js/main.js"></script>
</body>

</html>

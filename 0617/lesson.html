<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage</title>
</head>
<body>
    <h1>LocalStorage</h1>

    <script>
        const candidates = [
                { id: 1, name: 'A', votes: 0 },
                { id: 2, name: 'B', votes: 3 },
            ];

            // 保存（オブジェクト → 文字列）
            localStorage.setItem('candidates', JSON.stringify(candidates));

            // 取得（文字列 → オブジェクト）
            const data = JSON.parse(localStorage.getItem('candidates'));
            console.log(data[1].votes); // 3

            const c=localStorage.getItem('candidates');
    </script>

</body>
</html>
